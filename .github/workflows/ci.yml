name: CI

# Runs on pull requests, and is the gate docker-publish.yml calls before it publishes
# anything, so the checks guarding a PR and the checks guarding a deploy can't drift apart.
# The simulations (npm run test:sim) stay local: the family's rule for games.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The built page and a room over the WebSocket, served by the real production server.
      - name: Smoke test the production server
        run: |
          DATA_DIR=$(mktemp -d) PORT=6399 node server/server.mjs &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:6399/healthz && break; sleep 0.5; done
          base=http://127.0.0.1:6399
          curl -sf $base/ | grep -q '<title>CurveExtreme</title>'
          curl -sf $base/KXPT | grep -q '<title>CurveExtreme</title>'
          curl -sI $base/ | grep -qi "content-security-policy: default-src 'self'"
          curl -sI $base/ | grep -qi "cache-control: no-cache"
          curl -sf -o /dev/null $base/icon.svg
          asset=$(curl -s $base/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sI "$base$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $base/)" = 405
          curl -sf $base/api/profiles | grep -q '"name":"Classic"'
          # A room over the socket: hello, create, the room's view.
          node -e '
            const ws = new WebSocket("ws://127.0.0.1:6399/ws");
            const fail = setTimeout(() => { console.error("no room"); process.exit(1); }, 4000);
            ws.onopen = () => {
              ws.send(JSON.stringify({ t: "hello", id: "ci-player-0001", secret: "ci-secret-00001", name: "CI" }));
              ws.send(JSON.stringify({ t: "create" }));
            };
            ws.onmessage = (e) => {
              const m = JSON.parse(e.data);
              if (m.t === "room" && /^[A-Z]{4}$/.test(m.code)) { clearTimeout(fail); ws.close(); process.exit(0); }
            };
          '
