# For trying the image locally (it builds from source). The NAS runs deploy/portainer-stack.yml.
services:
  curveextreme:
    build: .
    image: ghcr.io/ewolution94/curveextreme:latest
    container_name: curveextreme
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - curveextreme-data:/data

volumes:
  curveextreme-data:
